{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h2>create Account</h2>

        <form method="post" class="form-box">
            {% csrf_token %}

        <div class="form-group">
            <label >Username</label>
            {{ form.username }}
            <small class="hint">{{ form.username.help_text }}</small>
        </div>
        <div class="form-group">
            <label >Email</label>
            {{ form.email }}
            <small class="hint">{{ form.email.help_text }}</small>
        </div>
        <div class="form-group">
            <label >Password</label>
            {{ form.password1 }}
            <small class="hint">{{ form.password1.help_text }}</small>
        </div>
        <div class="form-group">
            <label >Confirm Password</label>
            {{ form.password2 }}
            <small class="hint">{{ form.password2.help_text }}</small>
        </div>
         <button type="submit">Sign Up</button>
        </form>
    </div>
</body>

</html>
